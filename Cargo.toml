[workspace]
resolver = "2"
members = [
    "otter",
    "otter_codegen",
]
default-members = [
    "otter",
    "otter_codegen",
]
# The otter_test suite carries a separate cargo project (its NIF crate)
# with its own workspace. Excluding it keeps `cargo build` at the root
# from treating that crate as a workspace member.
exclude = [
    "otter_test",
]

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
